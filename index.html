  <style>
    /* Estilo para a tela de carregamento (Loader) */
    body {
      background-color: #F4F6F8; /* Mesma cor de fundo do seu app Flutter */
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: sans-serif;
    }
    .loader {
      border: 5px solid #E0F2F1;
      border-top: 5px solid #00796B;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <!-- Esse conteúdo sumirá assim que o Flutter carregar -->
  <div id="loading-indicator">
    <div class="loader"></div>
  </div>

  <script>
    window.addEventListener('load', function(ev) {
      // Remove o loader quando o Flutter estiver pronto
      var loadingIndicator = document.getElementById('loading-indicator');
      if (loadingIndicator) {
        // O Flutter remove o conteúdo do body automaticamente, 
        // mas isso garante uma transição mais limpa se necessário.
      }
    });
  </script>

  <!-- Script principal do Flutter -->
  <script src="flutter_bootstrap.js" async></script>
</body>
